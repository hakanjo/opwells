  define_groups.title: Defined groups
  define_groups.help: |-
    Define new groups based on combinations of variables in your data. The groups can then be used for illustrations and statistical comparisons.
    
    Select one or more groups in one or more columns, enter a name, and create a combined group.
  define_groups.combine.label: Group name
