  about.description: |-
    - OPWELLS är en enkät baserad på 10 frågor för att mäta äldres välbefinnande. OPWELLS är en förkortning för enkätens engelska benämning, *Older Persons Wellbeing Scale*.
    - I denna webbapplikation kan du ta fram mått på välbefinnande utifrån individers enkätsvar.
    - Du kan även illustrera skillnader mellan grupper och göra statistiska jämförelser inom dina data samt jämföra deras svar mot en referenspopulation*.
    - Under "Ladda upp data" kan du ladda upp dina enkätsvar tillsammans med ytterligare variabler som du vill kunna göra jämförelser för. Använd gärna mallen som finns där för att se hur dina data ska vara strukturerade.
    - OPWELLS är framtagna inom ramen för projektet "Mätning av äldres välbefinnande" och har finansierats av [Familjen Kamprads Stiftelse 🔗](https://familjenkampradsstiftelse.se). Om du har frågor om OPWELLS kan du [läsa mer här 🔗](#) eller kontakta [jeanette.melin@lnu.se 📧](mailto:jeanette.melin@lnu.se).

    \**Referensgruppen består av de (anonyma) personerna som deltog i utvecklingen av OPWELLS. De kommer från nio svenska projektparts- och samverkanskommuner.*
  
  data_input.help: |-
    Ladda upp en datafil (.xlsx, .csv, .tsv, eller .txt).
    
    Din fil för uppladdning måste innehålla en kolumn för varje OPWELLS-fråga.
    
    Namnen på kolumnerna måste följa formatet OPWELLS_1/F_1/Q_1, OPWELLS_2/F_2/Q_2 etc.

    Utöver svaren kan du inkludera ytterligare kolumner där varje kolumn representerar en variabel.
    
    *Tänk på att inte ladda upp personuppgifter.*
