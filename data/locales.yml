  define_groups.defined_groups: Defined groups

  plot.help: |-
    Illustrate differences in wellbeing between groups.
    
    Select one or more groups in one or more columns. When no groups are selected, reference data are shown. Hover over the points for details.

    The marker shows the group mean, and the line shows the range that covers ⅔ of the responses.

    You can save an illustration with the icons at the top right of the plot.
