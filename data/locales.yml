  about.description: |-
    - OPWELLS is a questionnaire based on 10 questions for measuring older persons' wellbeing. OPWELLS is an abbreviation of the questionnaire's English name, *Older Persons Wellbeing Scale*.
    - The measure of older persons' wellbeing is estimated based on their responses to the questionnaire and is presented on a 0–100 scale, where 0 indicates the lowest wellbeing and 100 indicates the highest wellbeing.
    - In this web application, you can calculate measures of wellbeing based on individuals' questionnaire responses.
    - You can also illustrate differences between groups and make statistical comparisons within your data, as well as compare their responses against a reference population*.
    - Under "Upload data", you can upload your questionnaire responses together with additional variables that you want to use for comparisons. Feel free to use the template provided there to see how your data should be structured.
    - OPWELLS was developed within the project "Measurement of older persons' wellbeing" and was funded by the [Familjen Kamprads Stiftelse 🔗](https://familjenkampradsstiftelse.se). If you have questions about OPWELLS, you can [read more here 🔗](#) or contact [jeanette.melin@lnu.se 📧](mailto:jeanette.melin@lnu.se).

    \**The reference group consists of the anonymous individuals who participated in the development of OPWELLS. They come from nine Swedish project partner and collaboration municipalities.*
    
  data_input.help.template_prefix: '**Feel free to use this template for uploading data:**'
  data_input.help.template_link: '**template (.xlsx)**'
  data_input.help: |-
    Upload a data file (.xlsx, .csv, .tsv, or .txt).

    Your file  for upload must contain one row per person with responses to each OPWELLS question written as the numbers Never = 0, Rarely = 1, Sometimes = 2, Often = 3, and Always = 4. The column names for each question must follow the format OPWELLS_1, OPWELLS_2, OPWELLS_3, etc.

    In addition to the responses, you can include additional columns with other variables that you have in your data and want to use for comparisons. You can, for example, include variables such as gender or age group. (In the template, these columns are included. If you do not have these variables in your data, you can delete the columns.) 
    
    *Remember not to upload personal data.*

