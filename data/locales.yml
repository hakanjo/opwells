  stats.explanation: |-
    The measure of older persons' wellbeing is estimated based on their responses to the questionnaire and is presented on a 0–100 scale, where 0 indicates the lowest wellbeing and 100 indicates the highest wellbeing.

  stats.explanation.ref_group: |-
    The reference group consists of the anonymous individuals who participated in the development of OPWELLS. They come from nine Swedish project partner and collaboration municipalities. Approximately 20% were recruited via home care services, 20% via senior organizations, and 10% via open activities. The remaining 50% were recruited through a combination of these activities. In total, data from 1,882 individuals were included. Of these were 70% women and 30% men, 40% were 79 years or younger and 60% were 80 years or older, and 88% were born in Sweden and 12% were born outside of Sweden.

  publications.description: |-
    So far, this work has resulted in three planned scientific publications, which are currently available as preprints. The content may therefore be revised before a final version is published in a scientific journal. Until the articles are published in scientific journals, we refer to the following references (the links lead to the articles).

    Study with cognitive interviews in Swedish (this describes the development of OPWELLS)

    Möllerberg, M.-L., Preuter, M., Årestedt, K., & Melin, J. (2026). Developing a Well-Being Scale for Older Persons in Sweden: A Cognitive Interview Study (Dkb8x_v1). SocArXiv. [https://osf.io/preprints/socarxiv/dkb8x_v1/](https://osf.io/preprints/socarxiv/dkb8x_v1/)

    Study of OPWELLS psychometrics (this is where OPWELLS is "established")

    Melin, J., Preuter, M., Årestedt, K., & Möllerberg, M.-L. (2026). Reinventing Well-being Measurements for Older Persons: Psychometric Evaluation of the Older Persons' Well-being Scale (OPWELLS) (V92xb_v1). SocArXiv. [https://osf.io/preprints/socarxiv/v92xb_v1/](https://osf.io/preprints/socarxiv/v92xb_v1/)

    Study with cognitive interviews in Arabic, Bosnian, and Finnish

    Möllerberg, M.-L., Khalaf, A., Hadziabdic, E., Hedman, C., Preuter, M., Årestedt, K., & Melin, J. (2026). Establishing Linguistic and Cultural Equivalence of the Older Persons' Well-being Scale's (OPWELLS) Arabic, Bosnian, and Finnish Versions: A Cognitive Interview Study with Residents in Sweden (5j8va_v1). SocArXiv. [https://osf.io/preprints/socarxiv/5j8va_v1/](https://osf.io/preprints/socarxiv/5j8va_v1/)
