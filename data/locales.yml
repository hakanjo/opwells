  about.description: |-
    - OPWELLS är en enkät baserad på 10 frågor för att mäta äldres välbefinnande. OPWELLS är en förkortning för enkätens engelska benämning, *Older Persons Wellbeing Scale*.
    - Måttet på de äldres välbefinnande är estimerat utifrån deras svar på enkäten och presenteras på en 0–100 skala, där 0 innebär lägst välbefinnande och 100 innebär högst välbefinnande.
    - Det finns en Q&A för OPWELLS [här 🔗](#).
    - I denna webbapplikation kan du ta fram mått på välbefinnande utifrån individers enkätsvar.

        - **Ladda upp data**: Här laddar du upp dina enkätsvar tillsammans med ytterligare variabler som du vill kunna göra jämförelser för.
        - **Definiera grupper**: Här skapas subgrupper utifrån kombinationer av variabler i dina data. Exempelvis, om du har variablerna kön och bakgrund kan du skapa en subgrupp av kvinnor med utländsk bakgrund.
        - **Illustrationer:** Här kan du göra visualiseringar av dina data samt jämföra deras välbefinnande med en referenspopulation\*.
        - **Statistiska jämförelser:** Här kan du få deskriptiv och jämförande statistisk för dina data samt jämföra deras välbefinnande med en referenspopulation\*.

    - Webbapplikation är framtagen som en första version och kan komma att uppdateras med nya funktioner i framtiden.
    - OPWELLS är framtagna inom ramen för projektet "Mätning av äldres välbefinnande" och har finansierats av [Familjen Kamprads Stiftelse 🔗](https://familjenkampradsstiftelse.se).
    - Om du har frågor om OPWELLS eller webbapplikationen kontakta [jeanette.melin@lnu.se 📧](mailto:jeanette.melin@lnu.se).

    \**Referensgruppen består av de (anonyma) personerna som deltog i utvecklingen av OPWELLS. De kommer från nio svenska projektparts- och samverkanskommuner.*
  data_input.help.template_prefix: '**Använd gärna denna mall för uppladdning av data:**'
  data_input.help.template_link: '**mall (.xlsx)**'
  data_input.help: |-
    **Tänk på att inte ladda upp personuppgifter.**

    Ladda upp en datafil (.xlsx, .csv, .tsv, eller .txt).

    Din fil för uppladdning måste innehålla en person per rad med svar på respektive OPWELLS fråga skriven med siffrorna
    - Aldrig = 0
    - Sällan = 1
    - Ibland = 2
    - Ofta = 3
    - Alltid = 4
    
    Namnen på kolumnerna för respektive fråga måste följa formatet OPWELLS_1, OPWELLS_2, OPWELLS_3, etc.

    Utöver svaren på OPWELLS kan du lägga till andra variabler som du vill göra jämförelser med. Dessa variabler måste vara kategorivariabler (t.ex. kön, tidpunkt eller åldersgrupp). Kontinuerliga variabler (exempelvis ålder i år) behöver först delas in i kategorier innan de används i analysen.
    
    I mallen finns det kolumner för kön och åldersgrupp. Dessa är exempel.Om du inte har dessa variabler i dina data så kan du radera kolumnerna. Om du har andra variabler än kön och ålder kan du lägga till nya kolumner.

