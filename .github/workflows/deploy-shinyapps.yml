name: Deploy Shiny app to shinyapps.io

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      RSCONNECT_USER: ${{ secrets.RSCONNECT_USER }}
      RSCONNECT_TOKEN: ${{ secrets.RSCONNECT_TOKEN }}
      RSCONNECT_SECRET: ${{ secrets.RSCONNECT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            make \
            g++

      - name: Restore renv environment
        uses: r-lib/actions/setup-renv@v2

      - name: Deploy app to shinyapps.io
        shell: bash
        run: |
          Rscript -e '
            rsconnect::setAccount(
              name = Sys.getenv("RSCONNECT_USER"),
              token = Sys.getenv("RSCONNECT_TOKEN"),
              secret = Sys.getenv("RSCONNECT_SECRET")
            )
            rsconnect::deployApp(
              appDir = ".",
              appName = "elderly_wellbeing",
              appTitle = "elderly_wellbeing",
              server = "shinyapps.io"
            )
          '
